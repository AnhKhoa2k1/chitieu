<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Chi Tiêu</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chi Tiêu">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <div class="eyebrow" id="topEyebrow"></div>
          <h1 id="topTitle">Hôm nay</h1>
        </div>
        <div class="topbar-actions">
          <button class="sync-chip" id="syncChip" aria-label="Đồng bộ"></button>
          <button class="icon-btn" id="settingsBtn" aria-label="Cài đặt">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="view" class="view"></main>

    <button class="fab" id="fab" aria-label="Ghi giao dịch">
      <svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>

    <nav class="tabbar" id="tabbar">
      <button data-tab="home" class="active">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3 2 11.5h3V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.5h3L12 3Z"/></svg>
        <span>Hôm nay</span>
      </button>
      <button data-tab="period">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M5 20V10h3v10H5Zm5.5 0V4h3v16h-3ZM16 20v-7h3v7h-3Z"/></svg>
        <span>Kỳ lương</span>
      </button>
      <span class="tab-spacer"></span>
      <button data-tab="assets">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2 3 6.5V9h18V6.5L12 2ZM5 10.5v7H4v2.5h16v-2.5h-1v-7h-3v7h-2.5v-7h-3v7H8v-7H5Z"/></svg>
        <span>Tài sản</span>
      </button>
      <button data-tab="history">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 5h16v2H4V5Zm0 6h16v2H4v-2Zm0 6h10v2H4v-2Z"/></svg>
        <span>Lịch sử</span>
      </button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
